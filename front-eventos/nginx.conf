# nginx del contenedor del front (uno en cada PC). No es el balanceador: ese está en nginx/ y corre solo en la PC 1.
# Sirve el front compilado y pasa /api/ a la api de esta misma PC, así http://IP-de-esta-PC anda solo.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # API: a la api de este mismo compose (el servicio "api", puerto 3000 de adentro de la red de Docker)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cualquier ruta del front (/login, /panel/eventos…) carga index.html, para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
